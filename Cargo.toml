[workspace]
members = [
    "api",
    "common",
    "front",
]
resolver = "3"

[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
actix-web = "4.0"
base64 = "0.23"
feed-rs = { git = "https://github.com/feed-rs/feed-rs.git", branch = "3.1.0-dev" }
gloo = "0.12"
log = "0.4"
opml = "1.0"
reqwest = "0.13"
regex = "1.4"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
url = "2.2"
uuid = "1.0"

[workspace.dependencies.jiff]
version = "1.0"
features = ["serde"]

[workspace.dependencies.envir]
version = "1.0"
default-features = false

[workspace.dependencies.elephantry]
version = "6.0"
features = ["date", "uuid"]

[workspace.dependencies.elephantry-extras]
version = "0.13"
features = ["serde"]

[workspace.dependencies.jsonwebtoken]
version = "12.0"
default-features = false
features = ["rust_crypto"]

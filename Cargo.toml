[workspace]
members = [
    "api",
    "common",
    "front",
]
resolver = "3"

[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
actix-web = "4.0"
base64 = "0.23"
feed-rs = "3.0"
gloo = "0.12"
log = "0.4"
opml = "1.0"
reqwest = "0.13"
regex = "1.4"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
url = "2.2"
uuid = "1.0"

[workspace.dependencies.jiff]
version = "0.2"
features = ["serde"]

[workspace.dependencies.envir]
version = "1.0"
default-features = false

[workspace.dependencies.elephantry]
version = "5.0"
features = ["jiff", "uuid"]

[workspace.dependencies.elephantry-extras]
version = "0.12"
features = ["serde"]

[workspace.dependencies.jsonwebtoken]
version = "11.0"
default-features = false
features = ["rust_crypto"]
